<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étape 1 — Tour de France 2026 — Cycle League RP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* =========================================================
           ÉTAPE DÉTAIL — STYLES SPÉCIFIQUES
           ========================================================= */

        .stage-page {
            min-height: 100vh;
        }

        /* ========================= 
           HERO ÉTAPE
           ========================= */

        .stage-hero {
            background: linear-gradient(
                135deg,
                #111827 0%,
                #1f2937 100%
            );
            color: white;
            border-radius: 0;
            padding: 60px 40px;
            margin-bottom: 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stage-hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(227, 255, 60, 0.1), transparent 40%),
                radial-gradient(circle at 80% 50%, rgba(0, 224, 198, 0.1), transparent 40%);
            pointer-events: none;
        }

        .stage-hero-content {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stage-badge {
            display: inline-block;
            background: var(--accent);
            color: #111;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .stage-hero h1 {
            margin: 0 0 16px;
            font-size: 56px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: var(--font-display);
        }

        .stage-hero .stage-subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin: 0;
        }

        /* ========================= 
           INFO ÉTAPE
           ========================= */

        .stage-info-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--accent);
        }

        .stage-info-header h2 {
            margin: 0;
            font-size: 32px;
        }

        .stage-type-badge {
            display: inline-block;
            background: rgba(227, 255, 60, 0.2);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .stage-info-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .info-item {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }

        .info-item .label {
            display: block;
            font-size: 12px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .info-item .value {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .difficulty-1 { color: #4ade80; }
        .difficulty-2 { color: #fbbf24; }
        .difficulty-3 { color: #f97316; }
        .difficulty-4 { color: #ef4444; }
        .difficulty-5 { color: #7c2d12; }

        .stage-description {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 24px 0 0;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* ========================= 
           TABLEAU RÉSULTATS
           ========================= */

        .results-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 28px;
            padding: 28px;
            box-shadow: var(--shadow);
        }

        .results-section h2 {
            margin: 0 0 24px 0;
            font-size: 28px;
            text-transform: uppercase;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table thead {
            background: var(--surface-alt);
        }

        .results-table thead th {
            text-align: left;
            font-family: var(--font-body);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            padding: 14px;
            border-bottom: 2px solid var(--accent);
        }

        .results-table tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .results-table tbody tr {
            transition: background 0.15s ease;
        }

        .results-table tbody tr:hover {
            background: var(--surface-alt);
        }

        .results-table tbody tr.winner {
            background: rgba(227, 255, 60, 0.08);
            font-weight: 600;
        }

        .results-table tbody tr.winner td {
            border-bottom-color: var(--accent);
        }

        .col-position,
        .col-number {
            text-align: center;
            font-weight: 700;
            width: 60px;
        }

        .col-position {
            color: var(--accent);
        }

        .rider-flag {
            margin-right: 8px;
            font-size: 16px;
        }

        .rider-name {
            font-weight: 600;
        }

        .col-time code {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--surface-alt);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--accent);
        }

        .col-gap {
            text-align: right;
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .col-points {
            text-align: center;
            width: 50px;
            font-weight: 700;
            color: var(--accent);
        }

        .results-table tbody tr.winner .col-points {
            background: rgba(227, 255, 60, 0.15);
            border-radius: 4px;
            padding: 12px 14px;
        }

        /* ========================= 
           RESPONSIVE
           ========================= */

        @media (max-width: 900px) {
            .stage-hero {
                padding: 40px 20px;
            }

            .stage-hero h1 {
                font-size: 42px;
            }

            .results-table {
                font-size: 13px;
            }

            .results-table thead th,
            .results-table tbody td {
                padding: 10px 8px;
            }

            .col-country {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .stage-hero {
                padding: 30px 16px;
            }

            .stage-hero h1 {
                font-size: 32px;
                letter-spacing: 1px;
            }

            .stage-info-details {
                grid-template-columns: 1fr 1fr;
            }

            .results-table {
                font-size: 12px;
            }

            .results-table thead th,
            .results-table tbody td {
                padding: 8px 6px;
            }

            .results-section {
                padding: 16px;
            }

            .col-number,
            .col-country {
                display: none;
            }

            .col-gap {
                font-size: 11px;
            }
        }

        .error-state {
            padding: 24px;
            text-align: center;
            color: var(--accent-danger);
            border: 1px dashed var(--accent-danger);
            border-radius: var(--radius);
            background: rgba(255, 77, 94, 0.1);
        }
    </style>
</head>

<body class="stage-page">

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <header>
        <div class="header-top">
            <h1>Cycle League <span class="tag">RP</span></h1>
            <div class="site-search">
                <input type="text" id="site-search-input" placeholder="Rechercher un coureur, une page..." autocomplete="off">
                <div id="site-search-results" class="site-search-results"></div>
            </div>
        </div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="coureurs.html">Coureurs</a>
            <a href="equipes.html">Équipes</a>
            <a href="courses.html">Courses</a>
            <a href="classements.html">Classements</a>
            <a href="tdf2026.html" class="nav-tdf">
                <img src="https://i.la-croix.com/836x/smart/2024/06/18/1489295-le-logo-du-tour-de-france-avant-le-depart-de-l-edi.jpg" alt="TdF 2026" class="tdf-icon">
                Tour de France 2026
            </a>
        </nav>
    </header>

    <!-- =====================================================
         HERO ÉTAPE
         ===================================================== -->

    <section class="stage-hero">
        <div class="stage-hero-content">
            <span class="stage-badge">📍 Étape 1</span>
            <h1>Tour de France 2026</h1>
            <p class="stage-subtitle">Contre-la-montre par équipes • Barcelone</p>
        </div>
    </section>

    <main>

        <!-- =====================================================
             INFORMATIONS ÉTAPE
             ===================================================== -->

        <section class="results-section">
            <div id="stage-info"></div>
        </section>

        <!-- =====================================================
             RÉSULTATS
             ===================================================== -->

        <section class="results-section">
            <h2>🏁 Résultats</h2>
            <div id="results-container">
                <p class="empty-state">Chargement des résultats…</p>
            </div>
        </section>

    </main>

    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>
        Cycle League RP — 2026
    </footer>

    <!-- Scripts -->
    <script src="js/stage-results.js"></script>
    <script src="js/search.js"></script>

</body>

</html>
