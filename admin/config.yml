backend:
  name: git-gateway
  branch: main

# Interface en français (optionnel mais cohérent avec le site)
locale: "fr"

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "riders"
    label: "Coureurs"
    files:
      - name: "riders"
        label: "Liste des coureurs"
        file: "data/riders.json"
        fields:
          - label: "Coureurs"
            name: "riders"
            widget: "list"
            summary: "{{fields.name}} — {{fields.team}}"
            fields:
              - { label: "ID (slug, unique, sans espaces)", name: "id", widget: "string", hint: "ex: egan-bernal" }
              - { label: "Nom complet", name: "name", widget: "string" }
              - { label: "Drapeau (emoji)", name: "flag", widget: "string", required: false }
              - { label: "Nationalité", name: "nationality", widget: "string" }
              - { label: "Équipe", name: "team", widget: "string" }
              - { label: "Date de naissance", name: "dob", widget: "string", hint: "ex: 13 janv. 1997" }
              - { label: "Poids", name: "weight", widget: "string", hint: "ex: 60 kg", required: false }
              - { label: "Taille", name: "height", widget: "string", hint: "ex: 1,75 m", required: false }
              - { label: "Classement RP", name: "rpRank", widget: "number", value_type: "int" }
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Glisse une image ou colle un chemin (ex: images/coureurs/nom.jpg)" }

              - label: "Spécialités"
                name: "specialties"
                widget: "list"
                required: false
                summary: "{{fields.label}} — {{fields.value}}"
                fields:
                  - { label: "Nom", name: "label", widget: "string", hint: "ex: Grimpeur, Sprint, GC..." }
                  - { label: "Valeur (0 à 100)", name: "value", widget: "number", value_type: "int", min: 0, max: 100 }

              - label: "Liens"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Libellé", name: "label", widget: "string", hint: "ex: Instagram" }
                  - { label: "URL", name: "url", widget: "string" }

              - label: "Palmarès"
                name: "palmares"
                widget: "list"
                required: false
                summary: "{{fields.year}}"
                fields:
                  - { label: "Année", name: "year", widget: "number", value_type: "int" }
                  - label: "Résultats de l'année"
                    name: "results"
                    widget: "list"
                    summary: "{{fields.pos}} — {{fields.race}}"
                    fields:
                      - { label: "Position", name: "pos", widget: "string", hint: "ex: 1er, 3e..." }
                      - { label: "Victoire ?", name: "win", widget: "boolean", default: false }
                      - { label: "Course", name: "race", widget: "string" }
                      - { label: "Note (optionnel)", name: "note", widget: "string", required: false, hint: "ex: étape de montagne" }

              - label: "Résultats récents"
                name: "recentResults"
                widget: "list"
                required: false
                summary: "{{fields.race}} — {{fields.pos}}"
                fields:
                  - { label: "Course", name: "race", widget: "string" }
                  - { label: "Étape", name: "stage", widget: "string", required: false }
                  - { label: "Position", name: "pos", widget: "string" }
                  - { label: "Temps", name: "time", widget: "string" }
